# CI + supply-chain gate for the open-core `advance-agents` runtime.
#
# This is the repo's FIRST CI configuration (there was previously no `.github/`).
# It fulfils the "SUPPLY CHAIN FOLLOW-UP" promise recorded in the workspace
# `Cargo.toml` (~lines 344-358): every third-party dependency is exact-pinned
# (`=x.y.z`), which deliberately blocks silent `cargo update` — including silent
# CVE patches. The mitigation is this gate: `cargo deny` + `cargo audit` re-run on
# every push/PR to `main`, so an advisory FIRES loudly and is cleared only by an
# intentional, reviewed version-bump commit.
#
# Toolchain: pinned to 1.91.0 in `rust-toolchain.toml`. We never hardcode a Rust
# version here — `actions-rust-lang/setup-rust-toolchain` reads the channel (and
# the `rustfmt`/`clippy` components) straight out of that file, so a future bump
# is a single-file diff that CI picks up automatically.
#
# Guest fixtures under `crates/runtime/tests/fixtures/guest-rust-*` are EXCLUDED
# from the workspace and target `wasm32-unknown-unknown` (their compiled
# `.core.wasm` outputs are committed and loaded as bytes at test time). Because
# they are excluded and prebuilt, none of the workspace jobs below build them, so
# no `rustup target add` is required. The commented step in `test`/`clippy` shows
# how to add the target ONLY if you are rebuilding a fixture.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the gate only needs to read the checked-out tree.
permissions:
  contents: read

# Supersede an in-flight run when a ref is pushed again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Exact-pin discipline: fail loudly rather than silently resolving a newer patch.
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Formatting — cheap, fails fast.
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (channel + components read from rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Built-in caching disabled here; we run Swatinem/rust-cache explicitly below.
          cache: false
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Lints — deny all warnings so the tree stays clean.
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # The excluded guest fixtures (wasm32-unknown-unknown) are NOT workspace
      # members, so `--all-targets` never touches them and no wasm target is
      # needed. Uncomment ONLY if a job is changed to rebuild a fixture:
      #   - run: rustup target add wasm32-unknown-unknown
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # Build — the whole workspace, lockfile-frozen.
  # Heavy: bundled SQLite (rusqlite/bundled), vendored libgit2, and Wasmtime 43 +
  # Cranelift all compile C/large Rust here, hence the generous timeout.
  # ---------------------------------------------------------------------------
  build:
    name: build (--workspace --locked)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked

  # ---------------------------------------------------------------------------
  # Test — the FIRST true full-workspace baseline.
  # Local development has only ever run per-crate suites because of an external
  # (SanDisk) volume TCC throttle that makes concurrent workspace tests unsafe on
  # the maintainer's machine. That is a LOCAL constraint only; GitHub's Linux
  # runners have no such limit, so this job is the first time `cargo test
  # --workspace` runs end to end. Timeout is intentionally generous: the run
  # (pack build, workspace tests, doc-tests, the reply-tracker suite) has to fit
  # with room to spare, so a slow runner is not mistaken for a hung test.
  # ---------------------------------------------------------------------------
  test:
    name: test (--workspace --locked)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compat parent SHA
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "COMPAT_PARENT_SHA=${PR_BASE_SHA}" >> "$GITHUB_ENV"
          elif [ "$EVENT_NAME" = "push" ]; then
            # `before` is all zeros on a branch's first push and unreachable after a
            # force-push (history rewrite); leave the variable unset then, and the
            # compat gate falls back to HEAD^ of this full-depth checkout.
            if git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "COMPAT_PARENT_SHA=${PUSH_BEFORE_SHA}" >> "$GITHUB_ENV"
            else
              echo "push before-SHA ${PUSH_BEFORE_SHA} is not in this checkout; compat gate uses HEAD^"
            fi
          fi
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Grep-guard tests (e.g. sole_round_advancer_grep_guard) shell out to `rg`.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Generate test locales (pid-lock probe env matrix)
        run: sudo apt-get install -y locales && sudo locale-gen de_DE.UTF-8 en_GB.UTF-8 zh_CN.UTF-8
      # Guest fixtures are excluded + prebuilt (.core.wasm committed), so the
      # workspace test run loads them as bytes. The wasm target is needed for the
      # pack build below (the agenda pack's skill tool.wasm is built from
      # `crates/packs/agenda-tools`, a workspace `exclude`), which the packs-dir
      # guard and the E2 pack witness then install with the real installer.
      - run: rustup target add wasm32-unknown-unknown
      - name: advance pack build (every packs/*.build.yaml)
        run: |
          set -euo pipefail
          for m in packs/*.build.yaml; do
            name="$(basename "$m" .build.yaml)"
            cargo run -p advance-cli --locked -- pack build "packs/$name" --out target/packs
          done
      - name: cargo test --workspace --locked
        env:
          ADVANCE_TEST_REQUIRE_LOCALES: "1"
        run: cargo test --workspace --locked
      # Feature-gated suites: `advance-reply-tracker`'s integration tests
      # (mode_dispatch, session_lifecycle, timeout_policy, deadlock_detection, …)
      # all declare `required-features = ["test-helpers"]`. The workspace run above
      # usually enables that feature via cross-crate unification (the `cli` crate's
      # dev-dependency turns it on), but we run the suite explicitly so these
      # witnesses are guaranteed to execute regardless of unification.
      - name: cargo test -p advance-reply-tracker --features test-helpers --locked
        run: cargo test -p advance-reply-tracker --features test-helpers --locked

  # ---------------------------------------------------------------------------
  # Operator file core on macOS (OSS-7). APFS on the runner disk is the gate.
  # HFS+ / exFAT / FAT32 images are attached with hdiutil and recorded only.
  # ---------------------------------------------------------------------------
  operator-fs-macos:
    name: operator-fs (macos-15 APFS gate)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          key: operator-fs-macos
      - name: APFS operator suite (gate)
        run: |
          set -euo pipefail
          args=()
          for f in crates/capabilities/cap-fs/tests/operator_*.rs; do
            args+=(--test "$(basename "$f" .rs)")
          done
          cargo test -p cap-fs --locked "${args[@]}" -- --test-threads=1
          cargo test -p advance-runtime-compose --test files_family_wiring --locked -- --test-threads=1
      - name: HFS+/exFAT/FAT32 images (record-only)
        continue-on-error: true
        run: |
          set -euo pipefail
          work="$(mktemp -d /tmp/operator-fs-images.XXXXXX)"
          cleanup() {
            hdiutil detach "$work/hfs" -quiet -force || true
            hdiutil detach "$work/exfat" -quiet -force || true
            hdiutil detach "$work/fat32" -quiet -force || true
          }
          trap cleanup EXIT
          mkdir -p "$work/hfs" "$work/exfat" "$work/fat32"
          hdiutil create -size 128m -fs HFS+ -volname vfHFS "$work/hfs.dmg"
          hdiutil create -size 128m -fs ExFAT -volname vfExFAT "$work/exfat.dmg"
          hdiutil create -size 128m -fs "MS-DOS FAT32" -volname VFFAT "$work/fat32.dmg"
          hdiutil attach "$work/hfs.dmg" -mountpoint "$work/hfs" -nobrowse
          hdiutil attach "$work/exfat.dmg" -mountpoint "$work/exfat" -nobrowse
          hdiutil attach "$work/fat32.dmg" -mountpoint "$work/fat32" -nobrowse
          export OPERATOR_FS_ROOTS="$work/hfs:$work/exfat:$work/fat32"
          echo "OPERATOR_FS_ROOTS=$OPERATOR_FS_ROOTS"
          diskutil info "$work/hfs" | tee "$work/hfs.info" || true
          diskutil info "$work/exfat" | tee "$work/exfat.info" || true
          diskutil info "$work/fat32" | tee "$work/fat32.info" || true
          cargo test -p cap-fs --test operator_paths --test operator_symlinks --locked -- --test-threads=1

  # ---------------------------------------------------------------------------
  # iOS bridge build — MODULE-001-T113 (8), ADR 2026-10-03 D3.
  # Builds the CONTRACT-210 bridge (rlib + cdylib + staticlib, so the iOS link step runs)
  # for aarch64-apple-ios. The bridge depends on advance-runtime-compose, so this
  # cross-compiles the whole composition graph and its C code: ring (C + pregenerated
  # aarch64 asm), libsqlite3-sys (bundled SQLite), sqlite-vec, libgit2-sys (vendored
  # libgit2; links iconv, Security, CoreFoundation), libz-sys (links the SDK's libz) and
  # wasmtime's helpers.c. The cc crate finds the iPhoneOS SDK through xcrun; no cmake,
  # bindgen or OpenSSL is involved. The `pulley` wasmtime feature is what lets the
  # embedded profile run guests on iOS: Pulley bytecode, no executable memory.
  # ---------------------------------------------------------------------------
  ios-bridge:
    name: bridge (aarch64-apple-ios)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # A deployment floor that current Xcode releases accept (the job prints the SDK and the
      # artefact's minos). Raise it here if a runner's Xcode rejects it.
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Add the iOS device target to the pinned toolchain
        run: |
          rustup target add aarch64-apple-ios
          # Xcode 16.4 nm cannot read Rust 1.91 (LLVM 21) objects. llvm-nm can.
          rustup component add llvm-tools-preview
      - name: Xcode and the iPhoneOS SDK in use
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo build -p advance-embedded-runtime-bridge --target aarch64-apple-ios --locked
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export SDKROOT
          cargo build -p advance-embedded-runtime-bridge --target aarch64-apple-ios --locked
      - name: The artefacts are device arm64 and export the C ABI
        run: |
          set -euo pipefail
          dir=target/aarch64-apple-ios/debug
          lib="$dir/libadvance_embedded_runtime_bridge.a"
          dylib="$dir/libadvance_embedded_runtime_bridge.dylib"
          ls -l "$lib" "$dylib"
          archs="$(lipo -archs "$dylib")" || { echo "lipo failed on $dylib"; exit 1; }
          [ "$archs" = "arm64" ] || { echo "dylib architectures: '$archs' (want arm64)"; exit 1; }
          load_cmds="$(otool -l "$dylib")" || { echo "otool failed on $dylib"; exit 1; }
          build_version="$(grep -A4 LC_BUILD_VERSION <<<"$load_cmds")" || { echo "$dylib has no LC_BUILD_VERSION"; exit 1; }
          echo "$build_version"
          grep -Eq '^ *platform 2$' <<<"$build_version" || { echo "platform is not 2 (iOS device)"; exit 1; }
          nm_bin="$(find "$(rustc --print sysroot)/lib/rustlib" -type f -name llvm-nm | head -1)"
          [ -n "$nm_bin" ] || { echo "llvm-nm missing from the pinned toolchain"; exit 1; }
          dylib_syms="$("$nm_bin" --extern-only --defined-only "$dylib")" || { echo "llvm-nm failed on $dylib"; exit 1; }
          lib_syms="$("$nm_bin" --extern-only --defined-only "$lib")" || { echo "llvm-nm failed on $lib"; exit 1; }
          for sym in advance_bridge_start advance_bridge_stop advance_bridge_health \
                     advance_bridge_on_lifecycle advance_bridge_last_error \
                     advance_bridge_free_handle advance_bridge_abi_version \
                     advance_bridge_start_v2 advance_bridge_client_api_base \
                     advance_bridge_client_api_session; do
            grep -q " _${sym}\$" <<<"$dylib_syms" || { echo "dylib lacks _${sym}"; exit 1; }
            grep -q " _${sym}\$" <<<"$lib_syms" || { echo "staticlib lacks _${sym}"; exit 1; }
          done
      - name: Release build and artefact sizes (pushes and manual runs)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export SDKROOT
          cargo build -p advance-embedded-runtime-bridge --target aarch64-apple-ios --locked --release
          ls -l target/aarch64-apple-ios/release/libadvance_embedded_runtime_bridge.a \
                target/aarch64-apple-ios/release/libadvance_embedded_runtime_bridge.dylib

  # ---------------------------------------------------------------------------
  # The MODULE-001-T113 (2) Pulley turn on an iOS simulator (ADR 2026-10-03 D3 "may also
  # run the Pulley turn on the iOS simulator"). Informational: never blocks a merge.
  # ---------------------------------------------------------------------------
  ios-sim-pulley-turn:
    name: Pulley turn on the iOS simulator (informational)
    if: github.event_name != 'pull_request'
    needs: ios-bridge
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-ios-sim
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the T113 (2) test binary for the simulator
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export SDKROOT
          cargo test -p advance-runtime-compose --test module_001_ac32_t113_2_pulley_turn \
            --target aarch64-apple-ios-sim --locked --no-run --message-format=json > build.jsonl
          bin="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "module_001_ac32_t113_2_pulley_turn" and .executable != null) | .executable' build.jsonl | tail -n1)" \
            || { echo "could not read the test executable from build.jsonl"; exit 1; }
          { [ -n "$bin" ] && [ -x "$bin" ]; } || { echo "no executable test binary: '$bin'"; exit 1; }
          echo "T113_BIN=$bin" >> "$GITHUB_ENV"
      - name: Boot an iPhone simulator and run the turn inside it
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier // empty')" \
            || { echo "simctl list runtimes failed"; exit 1; }
          [ -n "$runtime" ] || { echo "no available iOS simulator runtime"; exit 1; }
          devtype="$(xcrun simctl list devicetypes --json | jq -r '[.devicetypes[] | select(.productFamily == "iPhone")] | last | .identifier // empty')" \
            || { echo "simctl list devicetypes failed"; exit 1; }
          [ -n "$devtype" ] || { echo "no iPhone device type"; exit 1; }
          udid="$(xcrun simctl create t113-pulley "$devtype" "$runtime")" || { echo "simctl create failed"; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          SIMCTL_CHILD_RUST_BACKTRACE=1 xcrun simctl spawn "$udid" "$T113_BIN" \
            --exact module_001_ac32_t113_2_embedded_pulley_turn_no_exec_memory_no_child \
            --nocapture --test-threads 1

  # ---------------------------------------------------------------------------
  # cargo-deny — the hard supply-chain gate.
  # Policy (see deny.toml): `bans`, `licenses`, and `sources` are POSTURE
  # INVARIANTS and hard-block the merge. `advisories` are EXPECTED to fire against
  # the exact-pins and are surfaced (non-blocking) — a real fix is an intentional
  # version-bump commit, not a CI override. That is why the two checks are split
  # into a blocking step and a `continue-on-error` step.
  # ---------------------------------------------------------------------------
  deny:
    name: cargo-deny (bans/licenses/sources = blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Compiled from source with the pinned toolchain. A faster alternative is
      # `taiki-e/install-action@cargo-deny` (prebuilt binary) if install time hurts.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check bans licenses sources (BLOCKING)
        run: cargo deny check bans licenses sources
      - name: cargo deny check advisories (surface only, non-blocking)
        run: cargo deny check advisories
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # cargo-audit — RustSec advisory scan.
  # Non-blocking by design: advisories against the exact-pins are the EXPECTED
  # steady state and must be visible without wedging every merge. Clear them with
  # a deliberate bump commit (which flips this green again).
  # ---------------------------------------------------------------------------
  audit:
    name: cargo-audit (surface advisories, non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (non-blocking — advisories on exact-pins are expected)
        run: cargo audit
        continue-on-error: true
      # Fulfils the third leg of the Cargo.toml supply-chain promise: surface pins
      # that have a newer patch available, so bumps stay a conscious choice.
      # `cargo-outdated` is optional tooling; keep informational and non-blocking.
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked
        continue-on-error: true
      - name: cargo outdated -R (informational)
        run: cargo outdated -R
        continue-on-error: true
