# Aspect `schedule` — an entity has it iff `starts` is present.
# Occurrences of a repeating entity are expanded into the index (366-day horizon), never
# written back to the file.
optional:
  starts:
    type: string
  ends:
    type: string
  all_day:
    type: boolean
    default: false
  repeat:
    type: string
  tz:
    type: string
