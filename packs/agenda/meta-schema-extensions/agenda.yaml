# Aspect `agenda` — the one aspect this pack owns.
# An entity has it iff `status` or `starts` is present. Grammar = meta-schema v2. Install only
# checks the file exists; the runtime merges it into the live schema when the pack applies.
aspect: agenda
key: [status, starts]

fields:
  status:
    type: [todo, doing, done, cancelled]
    transitions:
      todo: [doing, done, cancelled]
      doing: [todo, done, cancelled]
      done: [todo]
      cancelled: [todo]
  due:
    type: datetime
  priority:
    type: integer
  assignee:
    type: string
    inherit: true
  completed_at:
    type: datetime
    derive:
      when: { status: done }
      value: $now
      else: unset
  starts:
    type: datetime
  ends:
    type: datetime
    ensure: { gt: starts }
  all_day:
    type: boolean
  repeat:
    type: string            # RFC 5545 RRULE, e.g. FREQ=WEEKLY;BYDAY=MO
  exdates:
    type: list<datetime>    # occurrences removed from the series
  tz:
    type: string            # IANA zone, e.g. Asia/Shanghai

queries:
  open:
    where: { status: [todo, doing] }
    order: [due asc, priority desc]
  overdue:
    where: { status: [todo, doing], due: { lt: $now } }
    order: [due asc]
  day:
    args: { day: datetime }
    any_between: [$args.day, $args.day + 1d]
    order: [starts asc, due asc]
  upcoming:
    any_between: [$now, $now + 7d]
    order: [starts asc, due asc]

views:
  list:
    kind: list
    query: open                      # no order of its own: the query's [due asc, priority desc]
    columns: [title, status, due, priority, assignee]
  board:
    kind: board
    query: open
    group_by: status                 # lanes: todo, doing, done, cancelled (declared order)
    order: [priority desc, due asc]  # within each lane
    columns: [title, due, assignee, priority]
  calendar:
    kind: calendar
    query: upcoming
    columns: [title, status, assignee]
  form:
    kind: form
    columns: [title, status, due, priority, assignee, starts, ends, all_day, repeat, exdates, tz, completed_at]

operations:
  detach_occurrence: { tool: agenda, method: detach-occurrence }
  shift_series:      { tool: agenda, method: shift-series }

# Presentation only: labels, icons, formats and tones for clients. Validation, storage and
# queries never read it.
display:
  label: Agenda
  icon: calendar-check
  default_view: list
  view_order: [list, board, calendar]
  views:
    list:     { label: Open,     icon: list-todo }
    board:    { label: Board,    icon: kanban }
    calendar: { label: Calendar, icon: calendar }
    form:     { label: Details,  icon: pencil }
  fields:
    title:        { label: Title }
    status:
      format: badge
      label: Status
      values:
        todo:      { tone: neutral, label: To do }
        doing:     { tone: info,    label: In progress }
        done:      { tone: success, label: Done, icon: check }
        cancelled: { tone: muted,   label: Cancelled }
    due:          { format: date,       label: Due,      icon: calendar }
    priority:     { format: priority,   label: Priority }
    assignee:     { format: person,     label: Assignee, icon: user }
    completed_at: { format: relative,   label: Completed }
    starts:       { format: datetime,   label: Starts }
    ends:         { format: datetime,   label: Ends }
    all_day:      { format: checkbox,   label: All day }
    repeat:       { format: recurrence, label: Repeats,  icon: repeat }
    exdates:      { format: date,       label: Skipped }
    tz:           { format: timezone,   label: Time zone }
