# Build manifest for packs/agenda (entity-data lane E2). Lives OUTSIDE the pack
# directory because the install layout allow-list has no room for it. `advance pack build
# packs/agenda --out <dir>` builds each entry to `<out>/agenda/skills/<skill>/tool.wasm` and
# fills the output pack.yaml's checksums. The source pack stays text-only.
tools:
  - skill: agenda
    crate: crates/packs/agenda-tools
