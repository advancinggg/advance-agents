# MODULE-019 Slice E (m019-slice-e, 2026-05-15) — observability lint allowlist.
#
# Each entry waives one `HostFunctionHandler` impl from the AC-14 lint's
# emit-eligible call requirement. Schema:
#   crate, struct          — identify the impl
#   reason                 — non-empty human explanation
#   delegated_to | pending_wiring_slice — EXACTLY ONE; XOR is enforced by lint
#
# `delegated_to` value: `<crate>::<module>::<function>` (3+ segments) naming
# the actual emit-site. PR review enforces semantic truthfulness; lint only
# checks shape.
#
# `pending_wiring_slice` value: one of `MODULE-NNN <ref>`, `m<NNN>-slice-<letter>`,
# or `docs/<path>` (PR review enforces the referent exists).

# ─── cap-llm ────────────────────────────────────────────────────────────────

# AgentLlmGenerateHandler's `fn call` body delegates to gateway.generate()
# at host_fn.rs:359. gateway.generate() emits llm.request/response/retry/error
# via the emit_llm_* helpers in events.rs.
[[handler]]
crate = "cap-llm"
struct = "AgentLlmGenerateHandler"
reason = "Delegates to LlmGateway::generate; observability events emitted via emit_llm_request / emit_llm_response / emit_llm_retry / emit_llm_error helpers in cap-llm/src/events.rs (below the handler boundary)."
delegated_to = "advance_cap_llm::gateway::LlmGateway::generate"

# Stream + poll-stream: the S4 live path ships (2026-07-29, dev-task-s4-final).
# Emission lives BELOW the handler boundary — llm.request at begin and the single
# terminal llm.response/llm.error from the settlement winner inside the owner task
# (cap-llm/src/gateway.rs + stream.rs::Settlement::finalize). poll-stream never
# emits by design (MODULE-009 §2.7 invariant 6, Δ3), so neither handler body has an
# emit-eligible call site. Delegated, mirroring the AgentLlmGenerateHandler row.
[[handler]]
crate = "cap-llm"
struct = "AgentLlmStreamHandler"
reason = "Emission is delegated below the handler boundary: llm.request is emitted in stream_begin_live before dispatch, and the single terminal record comes from Settlement::finalize in the owner task (cap-llm/src/stream.rs)."
delegated_to = "advance_cap_llm::gateway::LlmGateway::stream_begin_live"

[[handler]]
crate = "cap-llm"
struct = "AgentLlmPollStreamHandler"
reason = "On the LIVE path poll-stream emits nothing by design (MODULE-009 §2.7 invariant 6, Δ3: the terminal record is published by the settlement winner at stream terminal, poll-independent). On the retained UNWIRED buffered path (Δ9) the deferred llm.response is emitted by LlmGateway::stream_finish, which the handler delegates to. Either way the handler body has no emit-eligible call site of its own."
delegated_to = "advance_cap_llm::gateway::LlmGateway::stream_finish"

