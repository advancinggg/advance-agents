# the composition-root SchedulerSubmitBridge; durable observation publication
# and CONTRACT-219 source refresh happen there after scheduler admission.
[[handler]]
crate = "cap-lifecycle"
struct = "ComponentSubmitHandler"
reason = "Legacy-3 CONTRACT-217 narrow component handler: the lint walks only HostFunctionHandler::call, which delegates through dispatch_component_submit and the ComponentSubmitGate port. The production registration binds that port to SchedulerSubmitBridge::submit_component_v2; the bridge performs scheduler admission, publishes the committed sensitive-name source, and refreshes the CONTRACT-219 observation projector. Keeping observation at that composition boundary avoids a duplicate or pre-commit WIT-boundary event. Read-only status/list operations intentionally emit nothing."
delegated_to = "advance_cli::component_submit_bridge::SchedulerSubmitBridge::submit_component_v2"

# Wave-12 Lane C (2026-06-23) added the narrow production `DecompositionHandler` —
# `register_agent_decomposition` registers submit-decomposition / update-subtask-status /
# get-decomposition over a `DecompositionStore` + an `EventBusEmit`. Its `fn call` body
