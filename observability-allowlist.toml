# `delegated_to` (the emitting free fn), NOT `pending_wiring_slice`.
[[handler]]
crate = "cap-lifecycle"
struct = "DecompositionHandler"
reason = "Wave-12 Lane C narrow decomposition-only handler: dispatches submit-decomposition / update-subtask-status / get-decomposition via the shared `dispatch_decomposition` free fn (the lint walks only the handler call body, so this entry is required). submit-decomposition emits task.decomposed and update-subtask-status emits task.subtask_updated through the injected EventBusEmit inside dispatch_decomposition; get-decomposition is a read-only query (no emit). Same emit path the sibling LifecycleHandler row documents for these 3 ops, now factored into dispatch_decomposition."
delegated_to = "cap_lifecycle::wit_impl::dispatch_decomposition"

