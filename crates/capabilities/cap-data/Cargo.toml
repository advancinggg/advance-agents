[package]
name = "cap-data"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
description = "Structured-data capability (`data`): the entity model over frontmatter (file / inline items / index.md), host-owned canonical writes, tiers and promotion, the `apply` reducer transaction and the `data` host tool. Skeleton — see the internal entity-data lane plan (lane E1)."

publish = false

[lib]
name = "cap_data"
path = "src/lib.rs"

[dependencies]
advance-shared-types = { path = "../../shared-types" }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
# entity-data lane gated witness tests (the internal entity-data lane plan §0.2)
lane-e1 = []

[lints]
workspace = true
