[package]
name = "clock-tool"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Entity-data lane E1 fixture: a `tool-exports` component whose single method `now` returns
# the WASI wall clock as RFC 3339 text. Built for `wasm32-wasip2` (std's clock maps to
# `wasi:clocks/wall-clock`, which the host freezes under `invoke_deterministic`). Excluded
# from the workspace like every other guest fixture.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.53.1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
