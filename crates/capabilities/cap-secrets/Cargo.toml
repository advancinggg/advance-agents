[package]
name = "cap-secrets"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

publish = false

[lib]
name = "cap_secrets"
path = "src/lib.rs"

[dependencies]
advance-runtime = { path = "../../runtime" }
advance-shared-types = { path = "../../shared-types" }
# wasmtime::component::Val is part of the HostFunctionHandler return-type boundary.
# cap-secrets does NOT construct Engine/Store/Linker — those remain advance-runtime's
# responsibility per MODULE-001 §1.1 architectural clarification.
wasmtime = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
keyring = { workspace = true }
hex = { workspace = true }
# /dev WS-A: FileSecretStorage serializes ciphertext StoredSecret blobs to JSON
# (hex-encoded via a private DTO; `hex` above does the byte<->string encoding).
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# keychain-sync: the iCloud-Keychain backend calls
# `SecItemAdd / SecItemCopyMatching / SecItemUpdate / SecItemDelete` directly (the `keyring`
# crate's macOS backend is the legacy file keychain and cannot set `kSecAttrSynchronizable` /
# `kSecUseDataProtectionKeychain`). Both crates are already in Cargo.lock through
# `keyring → security-framework`; the pins mirror the locked versions.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework-sys = "=2.17.0"
core-foundation = "=0.9.4"

[dev-dependencies]
tokio = { workspace = true }
# /dev WS-A: FileSecretStorage tests write to throwaway temp dirs.
tempfile = { workspace = true }

[lints]
workspace = true
