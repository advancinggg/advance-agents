[package]
name = "advance-home"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
description = "CONTRACT-243 workspace-home first-open host library."

publish = false

[lib]
name = "advance_home"
path = "src/lib.rs"

[dependencies]
advance-runtime = { path = "../runtime" }
advance-shared-types = { path = "../shared-types" }
cap-secrets = { path = "../capabilities/cap-secrets" }
cap-llm = { path = "../capabilities/cap-llm" }
cap-http = { path = "../capabilities/cap-http" }
# Providers-family adapter (`provider_admin`, hoisted 2026-09-28 from advance-cli).
advance-client-api = { path = "../client-api" }
tokio = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_yml = { workspace = true }
libc = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
secrecy = { workspace = true }
# Sign in with ChatGPT (`chatgpt_sign_in`): the credential-source port, the record, PKCE,
# the authorization URL / form bodies, constant-time comparisons, the host id, RS256.
async-trait = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
subtle = { workspace = true }
uuid = { workspace = true }
rsa = { workspace = true }

[dev-dependencies]
advance-shared-types = { path = "../shared-types", features = ["spawn-counter"] }
tempfile = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
