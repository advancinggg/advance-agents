[package]
name = "advance-observability-xtask"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
description = "MODULE-019 Slice E — observability lint enforcing the AC-01 / AC-14 entry/exit emit convention across capability crates. cargo xtask observability-lint walks cap-*/src/**/*.rs for HostFunctionHandler::call bodies, matches emit-eligible call patterns, exits non-zero on any unwaived violation."

publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
syn.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = { workspace = true, features = ["parse"] }
walkdir.workspace = true
# proc-macro2's `span-locations` feature is required for `Span::start().line`
# inside library (non-proc-macro) usage. Without it, `.start()` returns 0,0
# and violation reports lose file:line precision. proc-macro2 is pulled in
# transitively by syn; declaring it here as a direct dep makes the feature
# request explicit.
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[lints]
workspace = true
