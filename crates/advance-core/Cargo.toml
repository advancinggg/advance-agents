[package]
name = "advance-core"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
description = "Stable embedding façade for the advance-agents OSS core — re-exports the supported public surface (docs/OPEN-CORE-BOUNDARY.md §5/§6). External consumers pin this one crate (git dep + tag) instead of the ~30 internal crates."

# NOTE (pre-genesis): every dependency below carries an explicit `version` alongside
# `path` so `cargo package -p advance-core --no-verify` resolves (path-only deps are
# stripped at package time and would leave an unresolvable manifest). All versions are
# workspace-unified at 0.1.14; the release tool bumps them together with
# [workspace.package].version.

publish = false

[dependencies]
# ── seam layer (dependency-inversion home) ─────────────────────────────────
advance-shared-types = { path = "../shared-types", version = "0.1.32" }
# ── runtime host ───────────────────────────────────────────────────────────
advance-runtime = { path = "../runtime", version = "0.1.32" }
advance-home = { path = "../advance-home", version = "0.1.32" }
advance-embedded-runtime-bridge = { path = "../embedded-runtime-bridge", version = "0.1.32" }
# The runtime composition (`runtime_compose`): its CONTRACT-244 API only.
advance-runtime-compose = { path = "../runtime-compose", version = "0.1.32" }
# ── capability crates (11) ─────────────────────────────────────────────────
cap-channel = { path = "../capabilities/cap-channel", version = "0.1.32" }
cap-fs = { path = "../capabilities/cap-fs", version = "0.1.32" }
cap-grant = { path = "../capabilities/cap-grant", version = "0.1.32" }
cap-http = { path = "../capabilities/cap-http", version = "0.1.32" }
cap-lifecycle = { path = "../capabilities/cap-lifecycle", version = "0.1.32" }
cap-llm = { path = "../capabilities/cap-llm", version = "0.1.32" }
cap-mcp = { path = "../capabilities/cap-mcp", version = "0.1.32" }
cap-memory = { path = "../capabilities/cap-memory", version = "0.1.32" }
cap-secrets = { path = "../capabilities/cap-secrets", version = "0.1.32" }
cap-skills = { path = "../capabilities/cap-skills", version = "0.1.32" }
cap-tools = { path = "../capabilities/cap-tools", version = "0.1.32" }
# ── subsystem crates ───────────────────────────────────────────────────────
advance-client-api = { path = "../client-api", version = "0.1.32" }
advance-genui = { path = "../genui", version = "0.1.32" }
advance-context-engine = { path = "../context-engine", version = "0.1.32" }
advance-cost-tracker = { path = "../cost-tracker", version = "0.1.32" }
advance-database = { path = "../database", version = "0.1.32" }
advance-event-bus = { path = "../event-bus", version = "0.1.32" }
advance-git = { path = "../git", version = "0.1.32" }
advance-messaging = { path = "../messaging", version = "0.1.32" }
advance-pack-manager = { path = "../services/pack-manager", version = "0.1.32" }
advance-reply-tracker = { path = "../messaging/reply-tracker", version = "0.1.32" }
advance-run-manager = { path = "../run-manager", version = "0.1.32" }
advance-scheduler = { path = "../scheduler", version = "0.1.32" }
advance-scheduler-auto-loop = { path = "../scheduler/auto-loop", version = "0.1.32" }

[lints]
workspace = true
