[package]
name = "guest-rust-counter"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.53.1"

# Own workspace table so this fixture is EXCLUDED from `cargo test --workspace`
# (it targets wasm32-unknown-unknown; built out-of-band, the .core.wasm checked in).
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
