[package]
name = "advance-git"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
description = "advance-agents Git-version module: serialized commit queue, repo init, gitignore management (CONTRACT-020)."

publish = false

[dependencies]
advance-shared-types = { path = "../shared-types" }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
git2 = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# tokio/test-util enables `tokio::time::pause()` / `advance()` / `start_paused`
# for Slice C+D hot-reload integration tests. Workspace tokio stays lean;
# test-util is dev-only.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
