[package]
name = "guest-rust-write-then-trap"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# /dev Wave-19 Lane 4 (2026-06-26) — write-then-trap guest for SYS-AC-028. Its
# handle-message performs ONE `agent-fs::write` of a witness file at the territory
# ROOT (a bare filename → cap-fs creates exactly one `<territory>/.meta.yaml` sidecar),
# THEN returns Err. The production AgentLoopDriverImpl run_turn_once maps the Err to
# TrapError::Crash → handle_trap → (crash cascade +) the wired WorkspaceRollbackSink,
# which rolls the child territory's committed subtree back to the pre-turn commit. The
# write genuinely COMMITS (per-write CommitType::Turn) before the trap, so the rollback
# has a real committed write to compensate (anti-fake-green; the axis-off control proves
# the file would otherwise persist). Unlike guest-rust-trap (which never writes), this
# fixture CALLS agent-fs::write so the import is genuinely exercised, not tree-shaken.
# Excluded from the workspace (built for wasm32-unknown-unknown); the checked-in core
# module is wrapped to a Component at test time via build_agent::encode_core_to_component.

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.53.1"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
